name: Build Backend (FastAPI)

on:
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Build Docker image
        run: |
          docker build -t spendoo-ai-backend .

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name spendoo-test \
            -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} -e MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }} -e SPENDOO_DEPLOY=${{ secrets.SPENDOO_DEPLOY }} -e SPENDOO_ALLOWED_IP=${{ secrets.SPENDOO_ALLOWED_IP }} -p 8000:8000 spendoo-ai-backend
          # Wait for FastAPI to start
          sleep 10
          # Check health endpoint
          curl --fail http://localhost:8000/docs
          # Stop and remove container
          docker stop spendoo-test
          docker rm spendoo-test
